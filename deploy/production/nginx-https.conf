server {
    listen 443 ssl http2;
    server_name sa.starlineeducation.com.cn;

    # 与后端课件上传的 50MB 上限保持一致；轮播图仍由接口单独限制为 5MB。
    client_max_body_size 50m;

    ssl_certificate /etc/ssl/starline/sa.starlineeducation.com.cn.pem;
    ssl_certificate_key /etc/ssl/starline/sa.starlineeducation.com.cn.key;

    root /opt/starline/current/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8892/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 入口必须及时获取最新版本，避免浏览器继续使用旧入口引用已清理的 chunk。
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Vite 生成的 hash 资源是不可变文件；缺失时必须返回 404，不能回退成 index.html。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}

server {
    listen 443 ssl http2;
    server_name gate.starlineeducation.com.cn;

    # 请求会先经过网关，未设置时 Nginx 默认只允许约 1MB，图片上传会在到达后端前被拒绝。
    client_max_body_size 50m;

    ssl_certificate /etc/ssl/starline/gate.starlineeducation.com.cn.pem;
    ssl_certificate_key /etc/ssl/starline/gate.starlineeducation.com.cn.key;

    location /api/ {
        add_header Access-Control-Allow-Origin "https://sa.starlineeducation.com.cn" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Operator-ID, X-Operator-Name" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8892/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
